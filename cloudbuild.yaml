# Governing: docs/openspec/specs/wif/spec.md#req-0005

steps:
  # Step 1: Build Stage 1 base runner image from docker/runner.Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/runner.Dockerfile'
      - '-t'
      - 'codemender-runner:base'
      - '.'

  # Step 2: Build Stage 2 Cloud Run bootstrapper image from docker/cloudrun.Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'docker/cloudrun.Dockerfile'
      - '--build-arg'
      - 'BASE_IMAGE=codemender-runner:base'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/codemender-runner:${_IMAGE_TAG}'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/codemender-runner:latest'
      - '.'

  # Step 3: Push all tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO_NAME}/codemender-runner'

options:
  logging: CLOUD_LOGGING_ONLY
