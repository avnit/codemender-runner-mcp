# Governing: docs/openspec/specs/gitlab-ci/spec.md#req-0008, docs/openspec/specs/gitlab-ci-fix/spec.md#req-0001, SPEC-GITLAB-CI, SPEC-GITLAB-CI-FIX, ADR-0008
spec:
  inputs:
    image:
      description: "Digest-pinned docker/gitlab.Dockerfile image"
      regex: '^[^\s@]+@sha256:[0-9a-f]{64}$'
    stage:
      description: "Pipeline stage for CodeMender jobs"
      default: "test"
    git_depth:
      description: "Shallow clone depth for codemender-scan"
      default: "1"
      regex: '^[0-9]+$'
---
codemender-scan:
  stage: $[[ inputs.stage ]]
  image:
    name: "$[[ inputs.image ]]"
    entrypoint: [""]
  inherit:
    default: false
  needs: []
  dependencies: []
  interruptible: true
  timeout: 60 minutes
  id_tokens:
    GCP_OIDC_TOKEN:
      aud: "https://iam.googleapis.com/${GCP_WIF_PROVIDER}"
  variables:
    GIT_STRATEGY: "clone"
    GIT_SUBMODULE_STRATEGY: "none"
    GIT_DEPTH: "$[[ inputs.git_depth ]]"
  rules:
    - if: '$CODEMENDER_SCAN_ON_MR == "false"'
      when: never
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_MERGE_REQUEST_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - /usr/local/bin/cm-gitlab find
  artifacts:
    access: developer
    when: always
    expire_in: 7 days
    paths:
      - report.sarif
      - report.md
      - cm-logs/
    reports:
      sarif: report.sarif

codemender-verify:
  stage: $[[ inputs.stage ]]
  image:
    name: "$[[ inputs.image ]]"
    entrypoint: [""]
  inherit:
    default: false
  when: manual
  allow_failure: true
  interruptible: true
  timeout: 60 minutes
  needs:
    - job: codemender-scan
      artifacts: false
  dependencies: []
  id_tokens:
    GCP_OIDC_TOKEN:
      aud: "https://iam.googleapis.com/${GCP_WIF_PROVIDER}"
  variables:
    GIT_STRATEGY: "none"
    GIT_SUBMODULE_STRATEGY: "none"
  rules:
    - if: '$CODEMENDER_SCAN_ON_MR == "false"'
      when: never
    - if: '$CI_MERGE_REQUEST_EVENT_TYPE == "merge_train"'
      when: never
    - if: '$CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_MERGE_REQUEST_PROJECT_ID'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
  script:
    - /usr/local/bin/cm-gitlab verify --findings "${CODEMENDER_VERIFY_FINDING:-all}"
  artifacts:
    access: developer
    when: always
    expire_in: 7 days
    paths:
      - cm-logs/
