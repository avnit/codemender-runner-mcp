# CodeMender full-repository scan -> BigQuery + GitHub issues.
#
# Run from the Actions tab ("CodeMender Repo Scan" -> Run workflow) or:
#   gh workflow run cm-repo-scan.yml -f repo=owner/repo [-f issues_repo=owner/other] [-f ref=main]
#
# The workflow calls the deployed CodeMender MCP server (see deploy.sh). The
# server clones `repo`, runs `cm find` (full scan) in a new Cloud Run Job
# execution and stores every finding in BigQuery; this workflow then opens one
# GitHub issue per finding in `issues_repo`, skipping findings already filed.
#
# Setup (Settings -> Secrets and variables -> Actions):
#   variable CODEMENDER_MCP_URL     MCP endpoint, e.g. https://codemender-mcp-xxxx.run.app/mcp
#                                   (`terraform -chdir=terraform output -raw mcp_endpoint`)
#   secret   CODEMENDER_MCP_TOKEN   Bearer token:
#                                   gcloud secrets versions access latest --secret codemender-mcp-auth-token
#   secret   CODEMENDER_ISSUES_TOKEN  (only if issues_repo is NOT this repository) fine-grained
#                                   PAT with "Issues: read and write" on issues_repo.
# The MCP server's own GitHub token (Secret Manager) must be able to clone `repo`.

name: CodeMender Repo Scan

on:
  workflow_dispatch:
    inputs:
      repo:
        description: Repository to clone and scan (owner/repo or https URL)
        required: true
        type: string
      issues_repo:
        description: Repository to create GitHub issues in (default = repo to scan)
        required: false
        type: string
        default: ""
      ref:
        description: Branch, tag or commit SHA (default = default branch)
        required: false
        type: string
        default: ""
      min_severity:
        description: Lowest SARIF level to file as an issue (all findings still go to BigQuery)
        required: false
        type: choice
        options: [NOTE, WARNING, ERROR]
        default: NOTE
      max_issues:
        description: Maximum new issues to create in this run
        required: false
        type: string
        default: "50"
      create_issues:
        description: Create GitHub issues (uncheck for scan + BigQuery only)
        required: false
        type: boolean
        default: true
      dry_run:
        description: List the issues that would be created without creating them
        required: false
        type: boolean
        default: false
      scan_job_id:
        description: Publish an existing scan job instead of starting a new one (e.g. after a timeout)
        required: false
        type: string
        default: ""

concurrency:
  group: codemender-repo-scan-${{ inputs.repo }}-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # used only when issues_repo is this repository (GITHUB_TOKEN)

jobs:
  scan:
    runs-on: ubuntu-latest
    # Full scans can take up to 3h (runner_timeout); 6h is the hosted-runner maximum.
    timeout-minutes: 350
    steps:
      - name: Check configuration
        shell: bash
        env:
          MCP_URL: ${{ vars.CODEMENDER_MCP_URL }}
          MCP_TOKEN: ${{ secrets.CODEMENDER_MCP_TOKEN }}
          ISSUES_TOKEN: ${{ secrets.CODEMENDER_ISSUES_TOKEN }}
          REPO_INPUT: ${{ inputs.repo }}
          ISSUES_REPO_INPUT: ${{ inputs.issues_repo }}
          CREATE_ISSUES: ${{ inputs.create_issues }}
        run: |
          set -euo pipefail
          [[ -n "$MCP_URL" ]] || { echo "::error::Set the CODEMENDER_MCP_URL repository variable (see workflow header)."; exit 1; }
          [[ -n "$MCP_TOKEN" ]] || echo "::warning::CODEMENDER_MCP_TOKEN is not set; calling the MCP server without a bearer token."
          norm() { sed -E 's#^(https?://[^/]+/|git@[^:]+:)##; s#\.git$##; s#/+$##' <<<"$1"; }
          target="$(norm "${ISSUES_REPO_INPUT:-$REPO_INPUT}")"
          if [[ "$CREATE_ISSUES" == "true" && "${target,,}" != "${GITHUB_REPOSITORY,,}" && -z "$ISSUES_TOKEN" ]]; then
            echo "::error::Issues go to ${target}, which is not ${GITHUB_REPOSITORY}. Add a CODEMENDER_ISSUES_TOKEN secret (fine-grained PAT, Issues: read and write on ${target})."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install client dependencies
        run: python -m pip install --disable-pip-version-check "mcp>=1.9.0,<2" "requests>=2.31,<3"

      - name: Scan, store in BigQuery, file issues
        id: scan
        shell: bash
        env:
          CODEMENDER_MCP_URL: ${{ vars.CODEMENDER_MCP_URL }}
          CODEMENDER_MCP_TOKEN: ${{ secrets.CODEMENDER_MCP_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.CODEMENDER_ISSUES_TOKEN || github.token }}
          IN_REPO: ${{ inputs.repo }}
          IN_ISSUES_REPO: ${{ inputs.issues_repo }}
          IN_REF: ${{ inputs.ref }}
          IN_MIN_SEVERITY: ${{ inputs.min_severity }}
          IN_MAX_ISSUES: ${{ inputs.max_issues }}
          IN_CREATE_ISSUES: ${{ inputs.create_issues }}
          IN_DRY_RUN: ${{ inputs.dry_run }}
          IN_SCAN_JOB_ID: ${{ inputs.scan_job_id }}
        run: |
          set -euo pipefail
          args=(--repo "$IN_REPO" --ref "$IN_REF" --issues-repo "$IN_ISSUES_REPO"
                --min-severity "$IN_MIN_SEVERITY" --max-issues "${IN_MAX_ISSUES:-50}"
                --timeout-minutes 330)
          [[ -n "$IN_SCAN_JOB_ID" ]] && args+=(--scan-job-id "$IN_SCAN_JOB_ID")
          [[ "$IN_CREATE_ISSUES" == "true" ]] || args+=(--no-issues)
          [[ "$IN_DRY_RUN" == "true" ]] && args+=(--dry-run)
          python scripts/cm_scan_issues.py "${args[@]}"
