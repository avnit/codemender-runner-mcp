name: Build & Publish CodeMender Runner Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/codemender/**'
      - 'docker/runner.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build_runner_image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/codemender/**'
      - 'docker/runner.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build_runner_image.yml'
  workflow_dispatch:
    inputs:
      cm_version:
        description: 'Optional version/tag override from Artifact Registry (defaults to Dockerfile)'
        required: false
        default: ''
        type: string
      cm_custom_url:
        description: 'Optional direct download URL for custom/rollback binary'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          # Optional CODEMENDER_GHCR_TOKEN: a PAT (classic, `write:packages`) of the
          # package owner. It can push to any package that owner has, including one
          # linked to another repository, which this repository's GITHUB_TOKEN cannot.
          username: ${{ secrets.CODEMENDER_GHCR_TOKEN != '' && github.repository_owner || github.actor }}
          password: ${{ secrets.CODEMENDER_GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build Runner Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/runner.Dockerfile
          load: true
          tags: codemender-runner:test
          build-args: |
            CM_VERSION=${{ inputs.cm_version || '' }}
            CM_URL=${{ inputs.cm_custom_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Contract
        run: |
          ENTRYPOINT=$(docker inspect --format='{{json .Config.Entrypoint}}' codemender-runner:test)
          CMD=$(docker inspect --format='{{json .Config.Cmd}}' codemender-runner:test)
          echo "Entrypoint: $ENTRYPOINT"
          echo "Cmd: $CMD"
          test "$ENTRYPOINT" = '["cm-runner"]'
          test "$CMD" = '["version"]'
          docker run --rm --entrypoint /opt/codemender/venv/bin/python codemender-runner:test -c "import codemender, codemender.runner, codemender.sarif, codemender.vcs"

      - name: Verify Version Command
        run: |
          docker run --rm codemender-runner:test version
          docker run --rm --entrypoint /opt/codemender/venv/bin/cm-runner codemender-runner:test version

      - name: Push Runner Image
        if: github.event_name != 'pull_request'
        env:
          CUSTOM_IMAGE: ${{ vars.CODEMENDER_RUNNER_IMAGE }}
          # Publish to ghcr.io/<owner>/<repo>: the package this repository's
          # GITHUB_TOKEN can create and write, and the default image the
          # codemender-local action pulls (ghcr.io/<action-or-workflow-repo>:latest).
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          USING_PAT: ${{ secrets.CODEMENDER_GHCR_TOKEN != '' }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          push() {
            local out
            if out="$(docker push "$1" 2>&1)"; then echo "$out"; return 0; fi
            echo "$out"
            if grep -qiE 'permission_denied|denied: ' <<<"$out"; then
              local pkg="${1#ghcr.io/}"; pkg="${pkg%:*}"; pkg="${pkg#*/}"
              if [[ "$USING_PAT" == "true" ]]; then
                echo "::error::Push to $1 was denied with CODEMENDER_GHCR_TOKEN. The token needs the 'write:packages' scope and must belong to the package owner (${REPOSITORY%%/*})."
              else
                echo "::error::Push to $1 was denied: package '${pkg}' already exists and is linked to another repository, so this repository's GITHUB_TOKEN cannot write to it. Fix one of: (a) unset the CODEMENDER_RUNNER_IMAGE variable to publish to ghcr.io/${REPOSITORY,,}; (b) grant access at ${SERVER_URL}/users/${REPOSITORY%%/*}/packages/container/package/${pkg}/settings -> Manage Actions access -> Add repository ${REPOSITORY} with role Write; (c) add a CODEMENDER_GHCR_TOKEN secret (classic PAT with write:packages)."
              fi
            fi
            return 1
          }
          DEFAULT_REPO="ghcr.io/${REPOSITORY,,}"
          TARGET_IMAGE="${CUSTOM_IMAGE:-${DEFAULT_REPO}:latest}"
          if [[ "${TARGET_IMAGE}" == ghcr.io/* ]]; then
            repo_part="${TARGET_IMAGE%:*}"
            tag_part="${TARGET_IMAGE##*:}"
            if [[ "${repo_part}" == "${TARGET_IMAGE}" ]]; then
              TARGET_IMAGE="${TARGET_IMAGE,,}:latest"
            else
              TARGET_IMAGE="${repo_part,,}:${tag_part}"
            fi
            docker tag codemender-runner:test "${TARGET_IMAGE}"
            push "${TARGET_IMAGE}"
          fi
          if [[ "${TARGET_IMAGE}" != "${DEFAULT_REPO}:latest" ]]; then
            docker tag codemender-runner:test "${DEFAULT_REPO}:latest"
            push "${DEFAULT_REPO}:latest"
          fi
          if [[ "${TARGET_IMAGE}" != "${DEFAULT_REPO}:${SHA}" ]]; then
            docker tag codemender-runner:test "${DEFAULT_REPO}:${SHA}"
            push "${DEFAULT_REPO}:${SHA}"
          fi
