name: Build & Publish CodeMender Runner Image

on:
  push:
    branches:
      - main
    paths:
      - 'codemender-runner/**'
      - '.github/workflows/build_runner_image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'codemender-runner/**'
      - '.github/workflows/build_runner_image.yml'
  workflow_dispatch:
    inputs:
      cm_version:
        description: 'Specific version/tag from Artifact Registry'
        required: false
        default: '0.9.0'
        type: string
      cm_custom_url:
        description: 'Optional direct download URL for custom/rollback binary'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Runner Image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: codemender-runner
          load: true
          tags: codemender-runner:test
          build-args: |
            CM_VERSION=${{ inputs.cm_version || '0.9.0' }}
            CM_URL=${{ inputs.cm_custom_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Contract
        run: |
          ENTRYPOINT=$(docker inspect --format='{{json .Config.Entrypoint}}' codemender-runner:test)
          CMD=$(docker inspect --format='{{json .Config.Cmd}}' codemender-runner:test)
          echo "Entrypoint: $ENTRYPOINT"
          echo "Cmd: $CMD"
          test "$ENTRYPOINT" = '["cm-runner"]'
          test "$CMD" = '["legacy"]'

      - name: Verify Version Command
        run: |
          docker run --rm codemender-runner:test version

      - name: Push Runner Image
        if: github.event_name != 'pull_request'
        run: |
          docker tag codemender-runner:test ghcr.io/${{ github.repository_owner }}/codemender-runner:latest
          docker tag codemender-runner:test ghcr.io/${{ github.repository_owner }}/codemender-runner:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/codemender-runner:latest
          docker push ghcr.io/${{ github.repository_owner }}/codemender-runner:${{ github.sha }}
