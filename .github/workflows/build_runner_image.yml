# Governing: ADR-0008, ADR-0009, SPEC-0003, REQ-0005, REQ-9431
name: Build & Publish CodeMender Runner Image

on:
  push:
    branches:
      - main
    paths:
      - 'packages/codemender/**'
      - 'packages/launcher/**'
      - 'docker/runner.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build_runner_image.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'packages/codemender/**'
      - 'packages/launcher/**'
      - 'docker/runner.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/build_runner_image.yml'
  workflow_dispatch:
    inputs:
      cm_version:
        description: 'Optional version/tag override from Artifact Registry (defaults to Dockerfile)'
        required: false
        default: ''
        type: string
      cm_custom_url:
        description: 'Optional direct download URL for custom/rollback binary'
        required: false
        default: ''
        type: string

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Runner Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/runner.Dockerfile
          load: true
          tags: codemender-runner:test
          build-args: |
            CM_VERSION=${{ inputs.cm_version || '' }}
            CM_URL=${{ inputs.cm_custom_url || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Contract
        run: |
          ENTRYPOINT=$(docker inspect --format='{{json .Config.Entrypoint}}' codemender-runner:test)
          CMD=$(docker inspect --format='{{json .Config.Cmd}}' codemender-runner:test)
          echo "Entrypoint: $ENTRYPOINT"
          echo "Cmd: $CMD"
          test "$ENTRYPOINT" = '["cm-worker"]'
          test "$CMD" = "null" -o "$CMD" = "[]"
          docker run --rm --entrypoint /opt/codemender/venv/bin/python codemender-runner:test -c "import codemender, codemender.runner, codemender.sarif, codemender.vcs, launcher, launcher.worker, launcher.cache"
          ! docker run --rm --entrypoint /opt/codemender/venv/bin/python codemender-runner:test -c "import repohost" 2>/dev/null

      - name: Verify Version Command
        run: |
          docker run --rm codemender-runner:test --help
          docker run --rm --entrypoint cm-runner codemender-runner:test version
          docker run --rm --entrypoint /opt/codemender/venv/bin/cm-runner codemender-runner:test version

      - name: Push Runner Image
        if: github.event_name != 'pull_request'
        env:
          CUSTOM_IMAGE: ${{ vars.CODEMENDER_RUNNER_IMAGE }}
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          DEFAULT_REPO="ghcr.io/${OWNER,,}/codemender-runner"
          TARGET_IMAGE="${CUSTOM_IMAGE:-${DEFAULT_REPO}:latest}"
          if [[ "${TARGET_IMAGE}" == ghcr.io/* ]]; then
            repo_part="${TARGET_IMAGE%:*}"
            tag_part="${TARGET_IMAGE##*:}"
            if [[ "${repo_part}" == "${TARGET_IMAGE}" ]]; then
              TARGET_IMAGE="${TARGET_IMAGE,,}:latest"
            else
              TARGET_IMAGE="${repo_part,,}:${tag_part}"
            fi
            docker tag codemender-runner:test "${TARGET_IMAGE}"
            docker push "${TARGET_IMAGE}"
          fi
          if [[ "${TARGET_IMAGE}" != "${DEFAULT_REPO}:latest" ]]; then
            docker tag codemender-runner:test "${DEFAULT_REPO}:latest"
            docker push "${DEFAULT_REPO}:latest"
          fi
          if [[ "${TARGET_IMAGE}" != "${DEFAULT_REPO}:${SHA}" ]]; then
            docker tag codemender-runner:test "${DEFAULT_REPO}:${SHA}"
            docker push "${DEFAULT_REPO}:${SHA}"
          fi
