name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      # Governing: ADR-0008, SPEC-GHA/REQ-0004
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            -e ./packages/artifactstore \
            -e ./packages/codemender \
            -e "./packages/launcher[cloudrun]" \
            -e "./packages/repohost[github,gitlab]" \
            -e ./packages/mcpserver \
            pytest pytest-cov httpx
      - name: Run workspace unit tests
        run: make test
      - name: Run distribution script unit tests
        run: |
          if [ -d "scripts/tests" ]; then
            python3 -m unittest discover -s scripts/tests -v
          fi
