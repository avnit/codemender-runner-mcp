[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codemender-repohost"
version = "0.1.0"
description = "CodeMender repository hosting platform integrations (GitHub, GitLab)"
requires-python = ">=3.11"
dependencies = [
    "codemender",
    "codemender-artifactstore",
    "codemender-launcher",
]

[project.optional-dependencies]
github = [
    "requests>=2.31.0,<3",
]
gitlab = [
    "requests>=2.31.0,<3",
]

# Governing: docs/openspec/specs/distribute/spec.md#req-0005, SPEC-DIST, ADR-0008
[project.scripts]
cm-github = "repohost.github.__main__:main"

[tool.uv.sources]
codemender = { workspace = true }
codemender-artifactstore = { workspace = true }
codemender-launcher = { workspace = true }

[tool.setuptools.packages.find]
where = ["src"]
include = ["repohost*"]
exclude = ["test_*", "*_test", "testdata*", "*test_*", "*testdata*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/test_*.py", "**/*_test.py", "**/testdata/**", "test_*.py", "*_test.py", "testdata/**"]
