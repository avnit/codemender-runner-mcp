[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codemender"
version = "0.1.0"
description = "Core CodeMender sandbox runner (cm-runner) and shared SARIF and local VCS primitives"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0.1",
]

[project.scripts]
cm-runner = "codemender.runner.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["codemender*"]
exclude = ["test_*", "*_test", "testdata*", "*test_*", "*testdata*"]

[tool.setuptools.exclude-package-data]
"*" = ["**/test_*.py", "**/*_test.py", "**/testdata/**", "test_*.py", "*_test.py", "testdata/**"]

